# Release builds for every supported platform.
#
# Pushing a tag `vX.Y.Z` builds the server for Linux, macOS, Windows and FreeBSD,
# each on x86_64 (amd64) and aarch64 (arm64), and publishes them as a GitHub
# release with a SHA-256 checksum file. It can also be run by hand from the
# Actions tab (without publishing) to check that everything still builds.
#
# Native runners are used wherever GitHub has one, so nothing is cross-compiled
# except macOS x86_64 (built on Apple silicon). The Linux builds target musl, so
# they are fully static and run on any distribution, old or new. FreeBSD has no hosted runners:
# it builds inside a FreeBSD virtual machine, the arm64 one under emulation,
# which is why that job is by far the slowest.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: rust-oidc

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   runner: ubuntu-24.04,     target: x86_64-unknown-linux-musl }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { name: macos-amd64,   runner: macos-14,         target: x86_64-apple-darwin }
          - { name: macos-arm64,   runner: macos-14,         target: aarch64-apple-darwin }
          - { name: windows-amd64, runner: windows-2022,     target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, runner: windows-11-arm,   target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The C parts (SQLite, aws-lc) are compiled against musl with musl-gcc.
      - if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      # aws-lc (the TLS crypto) assembles with NASM on x86_64 Windows.
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@v1

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            export CC_$(echo "${{ matrix.target }}" | tr - _)=musl-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the Linux binary is static
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          file "target/${{ matrix.target }}/release/${BIN}"
          file "target/${{ matrix.target }}/release/${BIN}" | grep -q "statically linked"
          "target/${{ matrix.target }}/release/${BIN}" --version

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="${BIN}-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${BIN}" README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:BIN-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe", README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  freebsd:
    name: freebsd-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, arch: x86_64 }
          - { name: arm64, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          arch: ${{ matrix.arch }}
          usesh: true
          # The VM does not inherit the job's environment unless asked.
          envs: "BIN GITHUB_REF_NAME"
          prepare: |
            pkg install -y rust cmake gmake
          run: |
            cargo build --release --locked
            dir="${BIN}-${GITHUB_REF_NAME}-freebsd-${{ matrix.name }}"
            mkdir "$dir"
            cp "target/release/${BIN}" README.md LICENSE "$dir/"
            tar czf "$dir.tar.gz" "$dir"

      - name: Find the package
        run: echo "ASSET=$(ls ${BIN}-*-freebsd-${{ matrix.name }}.tar.gz)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: publish
    needs: [build, freebsd]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

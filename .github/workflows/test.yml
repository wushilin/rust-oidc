# The SQLite test suite, on every push and pull request.
#
# This is what holds the house rules (AGENT.md) whoever writes the change: among
# the tests, tests/txn_only.rs fails when anything outside src/txn changes the
# directory. Postgres and MySQL runs are paused by the owner; they would be added
# here as service containers when they resume.

name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning is a failure: the tree is kept warning-free.
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned, so a new Rust release cannot turn CI red overnight with lints the
      # code has never met (1.99's clippy did exactly that). Raise it on purpose:
      # update the version here, run `cargo clippy --all-targets` on it, fix what
      # it finds, commit both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --all-targets
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Tests (SQLite)
        run: cargo test --no-fail-fast

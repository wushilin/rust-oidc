[package]
name = "rust-oidc"
version = "0.3.2"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
# A real HTTP client, in the binary and not only in the tests: the console's flow
# tester redeems its authorization code against our own token endpoint over HTTP
# rather than calling the handler directly, so what it reports is what a client
# would see. Minimal features: rustls (aws-lc-rs, the provider the rest of the
# binary already uses) and nothing else -- the request body is built by hand and
# the response parsed with serde_json, so `form` and `json` are not needed.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rsa = { version = "0.9.10", features = ["sha2", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-acme = { version = "0.15.4", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
sha1 = "0.11"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
x509-cert = { version = "0.3.0", features = ["pem"] }

[dev-dependencies]
# The test harness drives the server as a browser does: a cookie jar, form bodies
# and JSON responses, on top of the features the dependency above already asks for.
reqwest = { version = "0.13.5", features = ["cookies", "form", "json"] }
tempfile = "3.27.0"
